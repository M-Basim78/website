# Coolify reads ONE of these two filenames depending on how the application was
# created: the Docker Compose build pack stores a path, and it defaults to
# docker-compose.yml on some versions and docker-compose.yaml on others. A
# mismatch makes Coolify hand a null to Yaml::parse and the deploy dies with
#   Yaml::parse(): Argument #1 ($input) must be of type string, null given
# before it ever reaches the build. Both filenames are committed, byte identical,
# so the deploy works whichever one the app is pointed at. Edit them together.
#
# The Dockerfile build pack does not read this file at all and is the simpler
# choice: point Coolify at the Dockerfile and nothing here matters.
services:
  medpsycmoss:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # `expose`, not `ports`: Coolify puts the container behind its own proxy and
    # terminates TLS there. Publishing 80 on the host would fight with it.
    # For a local run, uncomment the ports line and open http://localhost:8080
    expose:
      - "80"
    # ports:
    #   - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s