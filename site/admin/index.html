<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Edit the site | MedPsycMoss</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{color-scheme:light}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:#FBF1F4;color:#1B2A4A}
  .boot{max-width:34rem;margin:14vh auto;padding:0 24px;text-align:center}
  h1{font-size:22px;letter-spacing:-0.02em;margin:0 0 10px}
  p{color:#55607D;font-size:15px;line-height:1.6;margin:0 0 8px}
  code{background:#F7E8EC;padding:2px 6px;border-radius:5px;font-size:13px}
  a{color:#6E1F35}
</style>
</head>
<body>

<!-- Shown only until the CMS mounts over it, or permanently if it cannot load. -->
<div class="boot" id="boot">
  <h1>Loading the editor</h1>
  <p>If this message stays on screen, the editor could not start.</p>
  <p>Check that you are signed in to GitHub with an account that has access to
     the site repository, then reload. Setup notes are in <code>docs/cms.md</code>.</p>
</div>

<script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
<script>
  // Sveltia replaces the page body once it initialises. If it never does, the
  // boot message above stays put and tells her what to check, rather than
  // leaving a blank white screen.
  setTimeout(function () {
    var boot = document.getElementById('boot');
    if (boot && document.querySelector('#nc-root, .sveltia-cms')) boot.remove();
  }, 4000);
</script>
</body>
</html>
