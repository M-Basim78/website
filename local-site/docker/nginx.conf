server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Clean URLs. Every page is written as <slug>/index.html by build-static.mjs,
    # so /store and /blog/tag/disability both resolve without a trailing slash.
    #
    # $uri/index.html is tried BEFORE $uri/ deliberately. Matching the directory
    # first makes nginx emit a 301 to the trailing-slash form, and it builds that
    # Location from its own listen port (8080), not the port the world sees. Behind
    # a reverse proxy that sends every visitor to a dead port. Serving the index
    # file directly avoids the redirect altogether.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Belt and braces for any redirect nginx still generates: emit it relative, so
    # the proxy's scheme, host and port are preserved.
    absolute_redirect off;

    # Fingerprint-free asset names, so HTML must always be revalidated.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Fonts and images never change without a new filename.
    location ~* \.(woff2|webp|svg|png|jpg|jpeg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # CSS and JS are not fingerprinted yet, so a shorter window with revalidation.
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }

    # A missing page should land somewhere useful rather than on nginx's default.
    error_page 404 /404.html;
    location = /404.html { internal; }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json image/svg+xml application/xml;

    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "SAMEORIGIN"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    server_tokens off;
}
