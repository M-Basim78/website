# Deploy:  docker compose up -d --build
#
# One service: it serves the public site and hosts the editor at /admin.
#
# Set a password and SESSION_SECRET in .env before deploying, never in this file.
# Either CMS_PASSWORD (hashed at boot) or CMS_PASSWORD_HASH from
# `node cms/hash-password.js "her password"`.

services:
  medpsycmoss:
    build:
      context: .
      dockerfile: Dockerfile
    image: medpsycmoss-site:latest
    container_name: medpsycmoss-site
    restart: unless-stopped

    environment:
      CMS_USER: "${CMS_USER:-stephanie}"
      # Set ONE of these two. The server hashes CMS_PASSWORD at boot, so changing
      # it here and restarting is all a password reset takes. CMS_PASSWORD_HASH
      # keeps the plain password off the server, which is tidier but means using
      # cms/hash-password.js to change it. If both are set the hash wins.
      CMS_PASSWORD: "${CMS_PASSWORD:-}"
      CMS_PASSWORD_HASH: "${CMS_PASSWORD_HASH:-}"
      # required: any long random string. Changing it signs everyone out.
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET to a long random string}"

      # ---- the shop ----------------------------------------------------------
      # Where Stripe sends the customer back to, so it must be the public
      # address, not the port this container listens on.
      SITE_ORIGIN: "${SITE_ORIGIN:-https://medpsycmoss.com}"
      # Her live secret key. Without it the shop refuses checkout rather than
      # pretending to work, and the rest of the site runs normally.
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      # From the webhook endpoint you create in her Stripe dashboard. Without it
      # every webhook is rejected, which is the correct default: an unverified
      # webhook must never fulfil an order.
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"

    # Loopback only; put a reverse proxy in front for TLS.
    #
    # The host port is 8899 because 8080 was already taken on the deploy server
    # and the container refused to start. Override HOST_PORT in the environment
    # if 8899 is busy too; the container always listens on 8080 inside.
    #
    # On Coolify, if you let it route by domain it reaches the container over the
    # Docker network and this publish is not needed at all. Removing it avoids
    # host port collisions entirely.
    ports:
      - "127.0.0.1:${HOST_PORT:-8899}:8080"

    # Only content/ is a volume, and that distinction matters.
    #
    # content/ holds her words, so it must survive a redeploy.
    # rebuild/ and dist/ are derived, so they must NOT be volumes: a named volume
    # there would shadow the image forever and silently ignore every template,
    # layout and code change you deploy. The entrypoint rebuilds them from the
    # image plus her content at every start, so both sides land.
    volumes:
      - content:/app/content

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  content:
