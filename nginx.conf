server {
    listen       80;
    listen  [::]:80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Coolify's proxy probes this.
    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

    # Clean URLs. Every page is written as <slug>/index.html, so /store and
    # /blog/tag/disability both resolve without a trailing slash.
    #
    # $uri/index.html is tried BEFORE $uri/ deliberately. Matching the directory
    # first makes nginx emit a 301 to the trailing-slash form, and it builds that
    # Location from its own listen port. Behind a reverse proxy that sends every
    # visitor to a port they cannot reach. Serving the index file directly avoids
    # the redirect altogether.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Second guard: emit any remaining redirect relative, so the proxy's scheme,
    # host and port are preserved.
    absolute_redirect off;

    # Pre-compressed at build time, so nginx serves the .gz off disk at no CPU cost.
    gzip_static on;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json image/svg+xml application/xml;

    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~* \.(woff2|webp|svg|png|jpg|jpeg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }

    error_page 404 /404.html;
    location = /404.html { internal; }

    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "SAMEORIGIN"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    server_tokens off;
}
